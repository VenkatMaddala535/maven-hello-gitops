apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: 
  name: maven-hello
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/VenkatMaddala535/maven-hello-gitops.git
    targetRevision: main
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
