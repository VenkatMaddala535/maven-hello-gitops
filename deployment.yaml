apiVersion: apps/v1
kind: Deployment
metadata:
  name: maven-hello
  namespace: default
spec:
  replicas: 2
  selector: 
    matchLabels:
      app: maven-hello
  template:
    metadata: 
      labels:
        app: maven-hello
    spec:
      containers:
        - name: maven-hello  
          image: venkatmaddala/maven-hello:18
          ports: 
            - containerPort: 8081
          imagePullPolicy: Always

